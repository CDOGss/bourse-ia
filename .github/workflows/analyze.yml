name: Analyse IA (2h)

on:
  # Declencheur PRINCIPAL : cron-job.org appelle workflow_dispatch a 09h20, 11h20, 13h20,
  # 15h20 et 17h20 (heure de Paris, lun-ven) - voir docs/declenchement-externe.md.
  # Le cron GitHub (retards de ~5 h constates en sept. 2026) n'est plus qu'un SECOURS :
  # `--secours` ne laisse passer que si aucun passage depuis `espacementSecoursMinutes`,
  # et jamais hors seance (09:00-17:35 Paris).
  schedule:
    - cron: "50 7,9,11,13,15 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Mode essai : pipeline complet sans appel a l'IA ni signaux"
        type: boolean
        default: false
      force:
        description: "Ignorer week-end et jours feriers boursiers"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: analyse
  cancel-in-progress: false

jobs:
  analyser:
    runs-on: ubuntu-latest
    outputs:
      pousse: ${{ steps.sauvegarde.outputs.pousse }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Tests
        run: node --test

      - name: Analyse (cours + actus + IA + papier trading)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=""
          [ "$DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
          [ "${{ github.event_name }}" = "schedule" ] && ARGS="$ARGS --secours"
          node src/run.js $ARGS

      - name: Committer l'etat (portfolio, dernier run, cours)
        id: sauvegarde
        run: |
          git config user.name "bourse-ia[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio.json data/last-run.json data/quotes.json
          if git diff --cached --quiet; then
            echo "Rien a committer (etat inchange)."
            exit 0
          fi
          MSG="analyse $(date -u '+%Y-%m-%d %H:%M UTC') (run #${GITHUB_RUN_ID})"
          git commit -m "$MSG"
          for i in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Pousse."
              echo "pousse=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push #${i} en echec, nouvelle tentative..."; sleep 15
          done
          echo "::error::impossible de pousser l'etat apres 3 tentatives"
          exit 1

  # Les déploiements Pages échouent parfois côté GitHub (erreur 500 le 25/11/2026) : le
  # site reste alors figé sur la version précédente. On relance le déploiement raté.
  surveiller-pages:
    needs: analyser
    if: always() && needs.analyser.outputs.pousse == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Relancer le déploiement Pages s'il a échoué
        run: |
          SHA=$(gh api "repos/$GH_REPO/commits/$GITHUB_REF_NAME" -q .sha)
          dernier() {
            gh run list --workflow pages-build-deployment --commit "$SHA" --limit 1 \
              --json databaseId,status,conclusion -q '.[0] | "\(.databaseId) \(.status) \(.conclusion)"'
          }
          # Attendre que le déploiement du commit poussé démarre puis se termine (10 min max).
          for i in $(seq 1 40); do
            read -r ID STATUS CONCL <<< "$(dernier)"
            [ "$STATUS" = completed ] && break
            sleep 15
          done
          if [ -z "$ID" ]; then echo "Aucun déploiement Pages trouvé pour $SHA."; exit 0; fi
          for essai in 1 2 3; do
            read -r ID STATUS CONCL <<< "$(dernier)"
            if [ "$CONCL" != failure ]; then echo "Déploiement Pages $ID : ${CONCL:-$STATUS}."; exit 0; fi
            echo "Déploiement Pages $ID en échec : relance $essai/3 dans $((essai * 30)) s."
            sleep $((essai * 30))
            gh run rerun "$ID" --failed
            sleep 15
            if gh run watch "$ID" --exit-status > /dev/null; then echo "Déploiement relancé avec succès."; exit 0; fi
          done
          echo "::error::déploiement Pages toujours en échec après 3 relances"
          exit 1
